buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 34
        ndkVersion = "27.1.12297006"
        cmakeVersion = "3.22.1"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// Every native Android subproject must use the same CMake binary. Several
// autolinked React Native modules own their externalNativeBuild block, so
// configuring only :app would leave their toolchain selection to the runner.
subprojects { nativeProject ->
    nativeProject.plugins.withId("com.android.application") {
        nativeProject.android.externalNativeBuild.cmake.version rootProject.ext.cmakeVersion
    }
    nativeProject.plugins.withId("com.android.library") {
        nativeProject.android.externalNativeBuild.cmake.version rootProject.ext.cmakeVersion
    }
}

apply plugin: "com.facebook.react.rootproject"
