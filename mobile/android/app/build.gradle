apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.0.1'

def requestedVersionCode = providers.gradleProperty("daoVersionCode").orNull
def requestedVersionName = providers.gradleProperty("daoVersionName").orNull
def resolvedVersionCode = requestedVersionCode ?: "1"
def resolvedVersionName = requestedVersionName ?: "1.0.0"
if (!(resolvedVersionCode ==~ /[1-9][0-9]*/)) {
    throw new GradleException("daoVersionCode must be a positive integer.")
}
if (!(resolvedVersionName ==~ /[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?/)) {
    throw new GradleException("daoVersionName must be a semantic version.")
}

def allowUnsignedRelease =
    providers.gradleProperty("daoAllowUnsignedRelease").orElse("false").get() == "true" &&
    System.getenv("CI") == "true"

// Release credentials must live outside the repository. A release build is
// rejected unless every value is present; it must never fall back to the
// public debug keystore or its standard credentials.
def releaseSigningEnv = [
    DAO_ANDROID_KEYSTORE_FILE: System.getenv("DAO_ANDROID_KEYSTORE_FILE"),
    DAO_ANDROID_KEYSTORE_PASSWORD: System.getenv("DAO_ANDROID_KEYSTORE_PASSWORD"),
    DAO_ANDROID_KEY_ALIAS: System.getenv("DAO_ANDROID_KEY_ALIAS"),
    DAO_ANDROID_KEY_PASSWORD: System.getenv("DAO_ANDROID_KEY_PASSWORD"),
]
def missingReleaseSigningEnv = releaseSigningEnv.findAll { key, value ->
    value == null || value.trim().isEmpty()
}.keySet()
def suppliedReleaseSigningEnv = releaseSigningEnv.findAll { key, value ->
    value != null && !value.trim().isEmpty()
}.keySet()
def releaseSigningPartiallyConfigured =
    !suppliedReleaseSigningEnv.isEmpty() && !missingReleaseSigningEnv.isEmpty()
def releaseSigningConfigured = missingReleaseSigningEnv.isEmpty()
def releaseKeystoreFile = releaseSigningConfigured
    ? file(releaseSigningEnv.DAO_ANDROID_KEYSTORE_FILE)
    : null

def validateReleaseEnvironment = tasks.register("validateReleaseEnvironment", Exec) {
    description = "Validates configuration embedded in the native Release bundle."
    workingDir rootProject.projectDir.parentFile
    commandLine "node", "scripts/verify-release-env.js"
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.daociudadanaapp"
    defaultConfig {
        applicationId "com.daociudadanaapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode.toInteger()
        versionName resolvedVersionName
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseSigningConfigured) {
            release {
                storeFile releaseKeystoreFile
                storePassword releaseSigningEnv.DAO_ANDROID_KEYSTORE_PASSWORD
                keyAlias releaseSigningEnv.DAO_ANDROID_KEY_ALIAS
                keyPassword releaseSigningEnv.DAO_ANDROID_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseTaskPresent = taskGraph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().contains("release")
    }
    if (releaseTaskPresent && (requestedVersionCode == null || requestedVersionName == null)) {
        throw new GradleException(
            "Release builds require explicit -PdaoVersionCode and -PdaoVersionName values."
        )
    }
    if (releaseTaskPresent && releaseSigningPartiallyConfigured) {
        throw new GradleException(
            "Release signing is partially configured. Missing environment variables: " +
            missingReleaseSigningEnv.join(", ")
        )
    }
    if (releaseTaskPresent && !releaseSigningConfigured && !allowUnsignedRelease) {
        throw new GradleException(
            "Release signing is not configured. Missing environment variables: " +
            missingReleaseSigningEnv.join(", ") +
            ". Unsigned release compilation is permitted only with " +
            "CI=true and -PdaoAllowUnsignedRelease=true."
        )
    }
    if (releaseTaskPresent && releaseSigningConfigured && !releaseKeystoreFile.isFile()) {
        throw new GradleException(
            "DAO_ANDROID_KEYSTORE_FILE does not point to a readable keystore file."
        )
    }
}

tasks.matching { task -> task.name == "preReleaseBuild" }.configureEach {
    dependsOn validateReleaseEnvironment
}

// React Native's bundle task does not know that this compile-time value is an
// input. Declare it explicitly so local/incremental builds cannot reuse a JS
// bundle produced for a different API origin.
tasks.matching { task -> task.name == "createBundleReleaseJsAndAssets" }.configureEach {
    inputs.property(
        "daoApiBaseUrl",
        providers.environmentVariable("DAO_API_BASE_URL")
    )
}

// Validate the generated App Bundle with the exact bundletool version pulled
// transitively by the pinned Android Gradle Plugin. That classpath is covered
// by Gradle's strict dependency-verification metadata.
def releaseBundleFile = layout.buildDirectory.file(
    "outputs/bundle/release/app-release.aab"
)
tasks.register("validateReleaseBundle", JavaExec) {
    group = "verification"
    description = "Validates the Release AAB with AGP's authenticated bundletool."
    dependsOn "bundleRelease"
    classpath = rootProject.buildscript.configurations.classpath
    mainClass = "com.android.tools.build.bundletool.BundleToolMain"
    args "validate", "--bundle=${releaseBundleFile.get().asFile.absolutePath}"
    inputs.file releaseBundleFile
    def validationOutput = new ByteArrayOutputStream()
    standardOutput = validationOutput
    errorOutput = validationOutput
    ignoreExitValue = true
    doLast {
        def result = executionResult.get()
        if (result.exitValue != 0) {
            logger.error(validationOutput.toString("UTF-8"))
            throw new GradleException("bundletool rejected the Release AAB.")
        }
        logger.lifecycle("Release AAB passed bundletool validation.")
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
