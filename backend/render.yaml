# Render Blueprint — DAO Ciudadana API
#
# Despliegue: Render → New → Blueprint → conectar el repositorio.
# Las variables con `sync: false` deben definirse en el dashboard para que
# secretos y cadenas de conexión no vivan en el repositorio.
services:
  - type: web
    name: dao-ciudadana-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      # Python 3.11 — misma versión que usa el CI
      - key: PYTHON_VERSION
        value: "3.11"

      # Cadena de conexión de MongoDB Atlas. Definir en el dashboard.
      - key: MONGO_URL
        sync: false

      - key: DB_NAME
        value: dao_ciudadana

      # Este blueprint mantiene el sitio público como piloto explícito. Para
      # APP_ENV=production el backend falla cerrado hasta que exista un grant
      # de identidad de un solo uso y minteo on-chain compatible.
      - key: APP_ENV
        value: demo
      - key: MINT_MODE
        value: demo
      - key: MEMBERSHIP_SOURCE
        value: mongo
      - key: SIGNED_BALLOTS_REQUIRED
        value: "false"

      # === Servicios añadidos tras la arquitectura ADR-001 ===
      # Todos van con `sync: false`: se definen en el dashboard y nunca en el
      # repositorio. `/health/ready` reporta cuáles faltan y qué funcionalidad
      # deja de estar disponible por cada una.

      # Firma la credencial EIP-191 de identidad ZK. DISTINTA de
      # MINTER_PRIVATE_KEY: firmar credenciales y enviar transacciones son
      # poderes separados y no deben compartir llave.
      - key: IDENTITY_ISSUER_PRIVATE_KEY
        sync: false

      # Proveedor civil real que emite los grants de un solo uso. Vacío = el
      # alta de nuevos ciudadanos queda bloqueada (falla cerrado).
      - key: IDENTITY_PROVIDER
        sync: false

      # Rate limiter y antifraude compartidos entre instancias (ROADMAP 3.8).
      # Sin esto los contadores son por proceso y el límite efectivo se
      # multiplica por el número de workers.
      - key: REDIS_URL
        sync: false

      # ERC-4337 no custodial. La URL del bundler lleva la API key del
      # proveedor, así que nunca se versiona. NO definir SAFE_OWNER_PRIVATE_KEY:
      # el backend no es owner ni custodio, y tenerla se reporta como error.
      - key: ERC4337_ENABLED
        value: "false"
      - key: BUNDLER_RPC_URL
        sync: false
      - key: ERC4337_ACCOUNT_IMPLEMENTATION
        value: safe
      - key: SAFE_4337_MODULE_ADDRESS
        value: "0x75cf11467937ce3F2f357CE24ffc3DBF8fD5c226"

      # MACICoordinator desplegado. El cliente contrasta la llave del
      # coordinador contra la cadena, no contra lo que diga el backend.
      - key: MACI_COORDINATOR_ADDRESS
        sync: false

      # Generada por Render, nunca commiteada
      - key: SECRET_KEY
        generateValue: true

      - key: IDENTITY_PEPPER
        sync: false
      - key: PII_ENCRYPTION_KEY
        sync: false

      # Datos incluidos en el mensaje EIP-4361 que firma la wallet.
      - key: SIWE_DOMAIN
        value: estamosdao.cl
      - key: SIWE_URI
        value: https://estamosdao.cl
      - key: SIWE_CHAIN_ID
        value: "11155111"

      # Dominio EXACTO del frontend, separado por comas. Nunca "*".
      # Solo el host canónico puede iniciar SIWE. Los alias deben redirigir a
      # este host antes de cargar la app, no ejecutar el flujo desde otro origen.
      - key: CORS_ORIGINS
        value: https://estamosdao.cl

      # false en producción: true expone /docs y /redoc
      - key: DEBUG
        value: "false"

      # No configurar SBT_CONTRACT_ADDRESS/RPC/MINTER aquí hasta redesplegar
      # el contrato AccessControl/bytes32. La dirección histórica 0x813f...
      # usa una ABI incompatible y no debe reutilizarse.
