# Configuración de flake8 (P-45). black y mypy viven en `pyproject.toml`,
# que flake8 todavía no sabe leer.

[flake8]
# black formatea el CÓDIGO a 88 (pyproject.toml). Lo que puede superar ese
# ancho son cadenas y comentarios, que black NO parte: si flake8 exigiera 88
# ahí, cada mensaje de error largo obligaría a partirlo a mano o a un `noqa`.
# 100 deja ese margen y sigue marcando lo que de verdad es ilegible.
max-line-length = 100

extend-ignore =
    # E203: black pone un espacio antes de `:` en los slices; PEP 8 dice que
    # no. Es el conflicto clásico entre ambos y lo resuelve la propia guía de
    # black: se ignora E203.
    E203,
    # W503/W504 se contradicen entre sí (salto de línea antes o después del
    # operador). black elige "antes", que es lo que W503 marca.
    W503,
    W504

exclude =
    .venv,
    .git,
    __pycache__,
    build,
    dist

per-file-ignores =
    # main.py carga el `.env` ANTES de importar los módulos de la aplicación:
    # la configuración se lee al importar `app.core.config`, así que mover los
    # imports arriba haría que el proceso arrancara sin variables. E402 aquí
    # describe una decisión, no un descuido.
    main.py:E402
    # Los scripts insertan la raíz del proyecto en sys.path antes de importar
    # `app.*`, por el mismo motivo.
    scripts/*.py:E402
    # Los `__init__` reexportan a propósito: ese es su trabajo.
    app/__init__.py:F401
    app/core/__init__.py:F401
    app/models/__init__.py:F401
    app/routers/__init__.py:F401
    app/services/__init__.py:F401
    # conftest fija variables de entorno antes de importar la aplicación, por
    # la misma razón que main.py.
    tests/conftest.py:E402
