name: Mobile native release

on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: mobile-native-release
  cancel-in-progress: false

jobs:
  metadata:
    name: Mobile · release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build_number: ${{ steps.metadata.outputs.build_number }}
      source_date_epoch: ${{ steps.metadata.outputs.source_date_epoch }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4 # v4.4.0
        with:
          node-version-file: mobile/.node-version
      - name: Validate immutable release metadata
        id: metadata
        working-directory: mobile
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'

          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            test "$RELEASE_REF" = "refs/tags/mobile-v$VERSION"
          fi

          # Commit count is stable for the same immutable source and remains
          # monotonic on main, unlike GITHUB_RUN_NUMBER across separate runs.
          BUILD_NUMBER="$(git rev-list --count "$RELEASE_SHA")"
          test "$BUILD_NUMBER" -gt 0
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$RELEASE_SHA")"

          {
            echo "version=$VERSION"
            echo "build_number=$BUILD_NUMBER"
            echo "source_date_epoch=$SOURCE_DATE_EPOCH"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: Mobile · release quality gates
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-node@v4 # v4.4.0
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit critical dependencies
        run: npm audit --audit-level=critical
      - name: Typecheck
        run: npm run typecheck
      - name: Lint without warning regressions
        run: npm run lint -- --max-warnings=21
      - name: Test
        run: npm test -- --ci --runInBand

  android:
    name: Mobile · signed Android release
    needs: [metadata, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: mobile-android-release
    permissions:
      attestations: write
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: mobile
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CI: 'true'
      DAO_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL }}
      DAO_MOBILE_DISTRIBUTION: 'true'
      DAO_VERSION_CODE: ${{ needs.metadata.outputs.build_number }}
      DAO_VERSION_NAME: ${{ needs.metadata.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.source_date_epoch }}
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4 # v4.4.0
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 17.0.18+8
          cache: gradle
      - name: Install pinned toolchain
        run: |
          npm ci
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006' \
            'cmake;3.22.1'
      - name: Import release keystore
        env:
          DAO_ANDROID_CERT_SHA256: ${{ secrets.DAO_ANDROID_CERT_SHA256 }}
          DAO_ANDROID_KEYSTORE_BASE64: ${{ secrets.DAO_ANDROID_KEYSTORE_BASE64 }}
          DAO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DAO_ANDROID_KEYSTORE_PASSWORD }}
          DAO_ANDROID_KEY_ALIAS: ${{ secrets.DAO_ANDROID_KEY_ALIAS }}
          DAO_ANDROID_KEY_PASSWORD: ${{ secrets.DAO_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${DAO_ANDROID_KEYSTORE_BASE64:?Missing Android keystore}"
          : "${DAO_ANDROID_KEYSTORE_PASSWORD:?Missing Android store password}"
          : "${DAO_ANDROID_KEY_ALIAS:?Missing Android key alias}"
          : "${DAO_ANDROID_KEY_PASSWORD:?Missing Android key password}"
          : "${DAO_ANDROID_CERT_SHA256:?Missing expected Android certificate SHA-256}"

          KEYSTORE="$RUNNER_TEMP/dao-ciudadana-release.jks"
          printf '%s' "$DAO_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 0600 "$KEYSTORE"
          echo "DAO_ANDROID_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

          CERTIFICATE_PEM="$RUNNER_TEMP/dao-ciudadana-release-certificate.pem"
          keytool -exportcert \
            -keystore "$KEYSTORE" \
            -storepass "$DAO_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$DAO_ANDROID_KEY_ALIAS" \
            -rfc > "$CERTIFICATE_PEM"
          # Do not produce a store artifact with a certificate that expires
          # within the next 30 days.
          openssl x509 -in "$CERTIFICATE_PEM" -checkend 2592000 -noout
          ACTUAL_CERT_SHA256="$(
            openssl x509 -in "$CERTIFICATE_PEM" -outform DER |
              shasum -a 256 |
              awk '{print $1}'
          )"
          EXPECTED_CERT_SHA256="$(printf '%s' "$DAO_ANDROID_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
      - name: Build and verify signed APK/AAB
        env:
          DAO_ANDROID_CERT_SHA256: ${{ secrets.DAO_ANDROID_CERT_SHA256 }}
          DAO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DAO_ANDROID_KEYSTORE_PASSWORD }}
          DAO_ANDROID_KEY_ALIAS: ${{ secrets.DAO_ANDROID_KEY_ALIAS }}
          DAO_ANDROID_KEY_PASSWORD: ${{ secrets.DAO_ANDROID_KEY_PASSWORD }}
        run: npm run android:release
      - name: Record checksums
        run: |
          cd android/app/build
          shasum -a 256 \
            outputs/apk/release/app-release.apk \
            outputs/bundle/release/app-release.aab \
            > outputs/release-checksums.sha256
      - name: Attest Android artifacts
        if: github.event.repository.visibility == 'public' || vars.ENABLE_MOBILE_ATTESTATION == 'true'
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dao-ciudadana-android-${{ needs.metadata.outputs.version }}-${{ github.run_attempt }}
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/release-checksums.sha256
            mobile/android/app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Remove signing material
        if: always()
        run: |
          if [[ -n "${DAO_ANDROID_KEYSTORE_FILE:-}" && "$DAO_ANDROID_KEYSTORE_FILE" == "$RUNNER_TEMP"/* ]]; then
            rm -f "$DAO_ANDROID_KEYSTORE_FILE"
          fi
          rm -f "$RUNNER_TEMP/dao-ciudadana-release-certificate.pem"

  ios:
    name: Mobile · signed iOS release
    needs: [metadata, quality]
    runs-on: macos-15
    timeout-minutes: 60
    environment: mobile-ios-release
    permissions:
      attestations: write
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: mobile
    env:
      BUNDLE_FROZEN: 'true'
      CI: 'true'
      DAO_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL }}
      DAO_MOBILE_DISTRIBUTION: 'true'
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER }}
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.source_date_epoch }}
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4 # v4.4.0
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # pinned 2026-08-02
        with:
          ruby-version: 3.3.12
          bundler: 2.4.22
          bundler-cache: true
          working-directory: mobile
      - name: Install locked dependencies
        run: |
          npm ci
          bundle exec pod install --project-directory=ios --deployment
          npm run config:release
          xcodebuild -version | grep -qx 'Xcode 16.4'
          xcodebuild -version | grep -qx 'Build version 16F6'
      - name: Provision pinned Chilean CSCA Master List
        env:
          IOS_CSCA_MASTER_LIST_BASE64: ${{ secrets.IOS_CSCA_MASTER_LIST_BASE64 }}
          IOS_CSCA_MASTER_LIST_SHA256: ${{ secrets.IOS_CSCA_MASTER_LIST_SHA256 }}
        run: |
          set -euo pipefail
          : "${IOS_CSCA_MASTER_LIST_BASE64:?Missing authorized CSCA Master List}"
          : "${IOS_CSCA_MASTER_LIST_SHA256:?Missing expected CSCA Master List SHA-256}"

          CSCA_MASTER_LIST="$RUNNER_TEMP/cscaMasterList.pem"
          printf '%s' "$IOS_CSCA_MASTER_LIST_BASE64" | base64 --decode > "$CSCA_MASTER_LIST"
          chmod 0600 "$CSCA_MASTER_LIST"
          {
            echo "DAO_CSCA_MASTER_LIST_PATH=$CSCA_MASTER_LIST"
            echo "DAO_CSCA_MASTER_LIST_SHA256=$IOS_CSCA_MASTER_LIST_SHA256"
          } >> "$GITHUB_ENV"
      - name: Import certificate and provisioning profile
        env:
          IOS_CERTIFICATE_SHA256: ${{ secrets.IOS_CERTIFICATE_SHA256 }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          : "${IOS_CERTIFICATE_P12_BASE64:?Missing iOS certificate}"
          : "${IOS_CERTIFICATE_PASSWORD:?Missing iOS certificate password}"
          : "${IOS_CERTIFICATE_SHA256:?Missing expected iOS certificate SHA-256}"
          : "${IOS_PROVISIONING_PROFILE_BASE64:?Missing provisioning profile}"
          : "${IOS_KEYCHAIN_PASSWORD:?Missing temporary keychain password}"
          : "${IOS_BUNDLE_IDENTIFIER:?Missing IOS_BUNDLE_IDENTIFIER variable}"
          : "${IOS_TEAM_ID:?Missing IOS_TEAM_ID variable}"
          printf '%s' "$IOS_TEAM_ID" | grep -Eq '^[A-Z0-9]{10}$'
          printf '%s' "$IOS_BUNDLE_IDENTIFIER" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9.-]+$'

          CERTIFICATE="$RUNNER_TEMP/mobile-release.p12"
          CERTIFICATE_PEM="$RUNNER_TEMP/mobile-release-certificate.pem"
          PROFILE="$RUNNER_TEMP/mobile-release.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/mobile-release-profile.plist"
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          KEYCHAIN="$RUNNER_TEMP/mobile-release.keychain-db"

          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          cp ios/ExportOptions.plist "$EXPORT_OPTIONS"
          chmod 0600 "$CERTIFICATE" "$PROFILE" "$EXPORT_OPTIONS"

          openssl pkcs12 \
            -in "$CERTIFICATE" \
            -clcerts \
            -nokeys \
            -passin env:IOS_CERTIFICATE_PASSWORD \
            -out "$CERTIFICATE_PEM"
          ACTUAL_CERT_SHA256="$(
            openssl x509 -in "$CERTIFICATE_PEM" -outform DER |
              shasum -a 256 |
              awk '{print $1}'
          )"
          EXPECTED_CERT_SHA256="$(printf '%s' "$IOS_CERTIFICATE_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" \
            -k "$KEYCHAIN" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$IOS_KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

          security cms -D -i "$PROFILE" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          PROFILE_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          PROFILE_EXPIRATION_EPOCH="$(
            bundle exec ruby -r cfpropertylist -e \
              'data = CFPropertyList.native_types(CFPropertyList::List.new(file: ARGV.fetch(0)).value); puts data.fetch("ExpirationDate").to_i' \
              "$PROFILE_PLIST"
          )"
          test "$PROFILE_TEAM" = "$IOS_TEAM_ID"
          test "$PROFILE_APP_ID" = "$IOS_TEAM_ID.$IOS_BUNDLE_IDENTIFIER"
          test "$PROFILE_EXPIRATION_EPOCH" -gt "$(date +%s)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PROFILE_PLIST")" = "false"
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$PROFILE_PLIST" >/dev/null 2>&1; then
            echo 'An App Store Connect profile must not contain ProvisionedDevices.' >&2
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$PROFILE_PLIST" >/dev/null 2>&1; then
            echo 'An App Store Connect profile must not set ProvisionsAllDevices.' >&2
            exit 1
          fi
          PROFILE_NFC_FORMATS="$(
            /usr/libexec/PlistBuddy -c \
              'Print :Entitlements:com.apple.developer.nfc.readersession.formats' \
              "$PROFILE_PLIST"
          )"
          printf '%s\n' "$PROFILE_NFC_FORMATS" | grep -qw NDEF
          printf '%s\n' "$PROFILE_NFC_FORMATS" | grep -qw TAG
          printf '%s' "$PROFILE_NAME" | grep -Eq '^[A-Za-z0-9 ._()+-]+$'

          /usr/libexec/PlistBuddy -c "Add :teamID string $IOS_TEAM_ID" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c \
            "Add :provisioningProfiles:$IOS_BUNDLE_IDENTIFIER string $PROFILE_NAME" \
            "$EXPORT_OPTIONS"
          plutil -lint "$EXPORT_OPTIONS"
          test "$(/usr/libexec/PlistBuddy -c 'Print :method' "$EXPORT_OPTIONS")" = 'app-store-connect'
          test "$(/usr/libexec/PlistBuddy -c 'Print :signingStyle' "$EXPORT_OPTIONS")" = 'manual'
          test "$(/usr/libexec/PlistBuddy -c 'Print :manageAppVersionAndBuildNumber' "$EXPORT_OPTIONS")" = 'false'

          PROFILE_DEST="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          mkdir -p "$(dirname "$PROFILE_DEST")"
          cp "$PROFILE" "$PROFILE_DEST"

          {
            echo "IOS_KEYCHAIN_PATH=$KEYCHAIN"
            echo "IOS_PROFILE_DEST=$PROFILE_DEST"
            echo "IOS_PROFILE_NAME=$PROFILE_NAME"
            echo "IOS_PROFILE_UUID=$PROFILE_UUID"
            echo "IOS_EXPORT_OPTIONS_PATH=$EXPORT_OPTIONS"
          } >> "$GITHUB_ENV"
      - name: Archive and export signed IPA
        env:
          BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/DAOCiudadanaApp.xcarchive"
          EXPORT_DIR="$RUNNER_TEMP/ios-export"

          xcodebuild archive \
            -workspace ios/DAOCiudadanaApp.xcworkspace \
            -scheme DAOCiudadanaApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -derivedDataPath "$RUNNER_TEMP/DAO-iOS-Release-DerivedData" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            MARKETING_VERSION="$RELEASE_VERSION" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$IOS_EXPORT_OPTIONS_PATH" \
            -exportPath "$EXPORT_DIR"

          IPA="$(find "$EXPORT_DIR" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -s "$IPA"
          IPA_EXTRACT_DIR="$RUNNER_TEMP/ios-exported-ipa"
          mkdir -p "$IPA_EXTRACT_DIR"
          ditto -x -k "$IPA" "$IPA_EXTRACT_DIR"
          APP="$(find "$IPA_EXTRACT_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test -s "$APP/main.jsbundle"
          test -s "$APP/PrivacyInfo.xcprivacy"
          plutil -lint "$APP/Info.plist" "$APP/PrivacyInfo.xcprivacy"
          APP_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          /usr/bin/lipo -verify_arch arm64 "$APP/$APP_EXECUTABLE"
          test -s "$APP/cscaMasterList.pem"
          EXPECTED_CSCA_SHA256="$(printf '%s' "$DAO_CSCA_MASTER_LIST_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL_CSCA_SHA256="$(shasum -a 256 "$APP/cscaMasterList.pem" | awk '{print $1}')"
          test "$ACTUAL_CSCA_SHA256" = "$EXPECTED_CSCA_SHA256"
          /usr/bin/nm -gj "$APP/$APP_EXECUTABLE" | grep -Fqx '_OBJC_CLASS_$_PassportReader'
          codesign --verify --deep --strict "$APP"
          CODESIGN_DETAILS="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          printf '%s\n' "$CODESIGN_DETAILS"
          printf '%s\n' "$CODESIGN_DETAILS" | grep -qx "TeamIdentifier=$IOS_TEAM_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "$IOS_BUNDLE_IDENTIFIER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$RELEASE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$BUILD_NUMBER"
          codesign -d --entitlements :- "$APP" \
            > "$RUNNER_TEMP/ios-entitlements.plist" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$RUNNER_TEMP/ios-entitlements.plist")" = "$IOS_TEAM_ID.$IOS_BUNDLE_IDENTIFIER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$RUNNER_TEMP/ios-entitlements.plist")" = "$IOS_TEAM_ID"
          EXPORTED_NFC_FORMATS="$(/usr/libexec/PlistBuddy -c \
            'Print :com.apple.developer.nfc.readersession.formats' \
            "$RUNNER_TEMP/ios-entitlements.plist")"
          printf '%s\n' "$EXPORTED_NFC_FORMATS" | grep -qw NDEF
          printf '%s\n' "$EXPORTED_NFC_FORMATS" | grep -qw TAG

          EXPORTED_PROFILE_PLIST="$RUNNER_TEMP/ios-exported-profile.plist"
          security cms -D -i "$APP/embedded.mobileprovision" > "$EXPORTED_PROFILE_PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$EXPORTED_PROFILE_PLIST")" = "$IOS_PROFILE_UUID"

          cp "$IPA" "$RUNNER_TEMP/DAOCiudadanaApp.ipa"
          ditto -c -k --keepParent "$ARCHIVE/dSYMs" "$RUNNER_TEMP/DAOCiudadanaApp-dSYMs.zip"
          cd "$RUNNER_TEMP"
          shasum -a 256 \
            DAOCiudadanaApp.ipa \
            DAOCiudadanaApp-dSYMs.zip \
            > ios-release-checksums.sha256
      - name: Attest iOS artifacts
        if: github.event.repository.visibility == 'public' || vars.ENABLE_MOBILE_ATTESTATION == 'true'
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            ${{ runner.temp }}/DAOCiudadanaApp.ipa
            ${{ runner.temp }}/DAOCiudadanaApp-dSYMs.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dao-ciudadana-ios-${{ needs.metadata.outputs.version }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/DAOCiudadanaApp.ipa
            ${{ runner.temp }}/DAOCiudadanaApp-dSYMs.zip
            ${{ runner.temp }}/ios-entitlements.plist
            ${{ runner.temp }}/ios-release-checksums.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Remove signing material
        if: always()
        run: |
          if [[ -n "${IOS_PROFILE_DEST:-}" && "$IOS_PROFILE_DEST" == "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"* ]]; then
            rm -f "$IOS_PROFILE_DEST"
          fi
          if [[ -n "${IOS_KEYCHAIN_PATH:-}" && "$IOS_KEYCHAIN_PATH" == "$RUNNER_TEMP"/* ]]; then
            security delete-keychain "$IOS_KEYCHAIN_PATH" || true
          fi
          # This deterministic fallback also covers failures before the import
          # step had a chance to append IOS_KEYCHAIN_PATH to GITHUB_ENV.
          security delete-keychain \
            "$RUNNER_TEMP/mobile-release.keychain-db" 2>/dev/null || true
          rm -f \
