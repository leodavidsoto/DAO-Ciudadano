name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Paso 4 del runbook de seguridad: escanear HEAD, ramas, tags e historial.
  # El incidente P0 (una EMERGENT_LLM_KEY commiteada en 8d66b97/6202a9f/9977a2f)
  # no lo detectó nada automático — se encontró leyendo el historial a mano.
  # Este job existe para que el segundo no dependa de que alguien mire.
  #
  # Escanea el historial COMPLETO, no solo el diff del PR: un secreto que entró
  # hace un año y sigue en un blob alcanzable sigue estando publicado.
  secrets:
    name: Seguridad · secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Binario oficial fijado por versión Y checksum, en vez de una acción de
      # terceros: es una dependencia más en la cadena de suministro del CI, y
      # esta corre sobre todo el historial del repositorio.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # historial completo: sin esto solo se ve el último commit
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      # Solo el escaneo de historial: cubre cada archivo rastreado en cada
      # commit, HEAD incluido. Un `gitleaks dir` adicional miraría exactamente
      # el mismo contenido en un checkout limpio, y se rompería en cuanto
      # alguien añadiera un paso de build al job (los artefactos de
      # frontend/build y mobile/android/build disparan el detector).
      #
      # --redact: los hallazgos van a un log público. Sin esto, el propio job
      # que denuncia una filtración la volvería a publicar.
      - name: Scan full git history
        run: ./gitleaks git . -c .gitleaks.toml --redact --no-banner --exit-code 1

  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install --break-system-packages -r requirements-dev.txt   # producción + pytest/linters
      - name: Audit production dependencies
        run: python -m pip_audit -r requirements.txt --strict
      - name: Run tests
        run: pytest -q --cov=app --cov-report=xml --cov-report=term --cov-fail-under=70

  backend-quality:
    name: Backend · black + flake8 + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install --break-system-packages -r requirements-dev.txt
      # Job aparte del de pytest a propósito: un fallo de formato no debe
      # esconder un test roto ni al revés, y así el nombre del check dice
      # exactamente qué hay que arreglar.
      - name: Formato (black)
        run: python -m black --check --diff app main.py scripts tests
      - name: Lint (flake8)
        run: python -m flake8 app main.py scripts tests
      - name: Tipos (mypy)
        run: python -m mypy app main.py

  contracts:
    name: Contracts · hardhat test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit critical dependencies
        run: npm audit --audit-level=critical
      - name: Run tests
        run: npx hardhat test

  slither:
    name: Contracts · slither
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          npm ci
          pip install --break-system-packages slither-analyzer==0.11.5
      - name: Static analysis
        # Gate: no medium-or-worse findings in our own contracts.
        # (ROADMAP 2.5 asks for no high findings; medium is verified clean too.)
        run: slither . --fail-medium --exclude-dependencies --exclude naming-convention

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit critical dependencies
        run: npm audit --audit-level=critical
      - name: Run tests
        run: npm test -- --watchAll=false --runInBand --coverage
        env:
          CI: 'true'
      - name: Build
        run: npm run build
        env:
          # Treat compiler/ESLint warnings as release failures in pull requests.
          CI: 'true'

  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run browser suite
        working-directory: e2e
        run: npm test
        env:
          CI: 'true'

  mobile:
    name: Mobile · static gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4 # v4.4.0
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit critical dependencies
        run: npm audit --audit-level=critical
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        # Keep the existing warning budget visible and reject regressions.
        run: npm run lint -- --max-warnings=21
      - name: Test
        run: npm test -- --ci --runInBand

  mobile-android:
    name: Mobile · Android native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CI: 'true'
      DAO_API_BASE_URL: https://mobile-ci.invalid/api
      DAO_VERSION_NAME: 1.0.0-ci
      DAO_VERSION_CODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-node@v4 # v4.4.0
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 17.0.18+8
          cache: gradle
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install pinned Android toolchain
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006' \
            'cmake;3.22.1'
      - name: Compile unsigned Release artifacts
        run: npm run android:ci
      - name: Record artifact checksums
        run: |
          cd android/app/build
          shasum -a 256 \
            outputs/apk/release/app-release-unsigned.apk \
            outputs/bundle/release/app-release.aab \
            > outputs/native-checksums.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-android-unsigned-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/native-checksums.sha256
            mobile/android/app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  mobile-ios:
    name: Mobile · iOS native
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      BUNDLE_FROZEN: 'true'
      CI: 'true'
      DAO_API_BASE_URL: https://mobile-ci.invalid/api
      DAO_XCODE_BUILD: 16F6
      DAO_XCODE_VERSION: '16.4'
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4 # v4.4.0
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # pinned 2026-08-02
        with:
          ruby-version: 3.3.12
          bundler: 2.4.22
          bundler-cache: true
          working-directory: mobile
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Compile unsigned Release for iOS device
        env:
          DAO_IOS_DERIVED_DATA_PATH: ${{ runner.temp }}/DAO-iOS-DerivedData
        run: npm run ios:ci
      - name: Package and checksum native app
        env:
          DAO_IOS_DERIVED_DATA_PATH: ${{ runner.temp }}/DAO-iOS-DerivedData
        run: |
          APP="$DAO_IOS_DERIVED_DATA_PATH/Build/Products/Release-iphoneos/DAOCiudadanaApp.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/DAOCiudadanaApp-device-unsigned.zip"
          cd "$RUNNER_TEMP"
          shasum -a 256 DAOCiudadanaApp-device-unsigned.zip \
            > DAOCiudadanaApp-device-unsigned.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-ios-unsigned-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/DAOCiudadanaApp-device-unsigned.zip
            ${{ runner.temp }}/DAOCiudadanaApp-device-unsigned.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
