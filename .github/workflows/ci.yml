name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt   # producción + pytest/linters
      - name: Run tests
        run: pytest -q

  contracts:
    name: Contracts · hardhat test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npx hardhat test

  slither:
    name: Contracts · slither
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          npm ci
          pip install slither-analyzer==0.11.5
      - name: Static analysis
        # Gate: no medium-or-worse findings in our own contracts.
        # (ROADMAP 2.5 asks for no high findings; medium is verified clean too.)
        run: slither . --fail-medium --exclude-dependencies

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Warnings are surfaced by their own step below rather than by failing
      # the build, so the claim that they are "tracked separately" is actually
      # true (audit finding N-16). Before this, nothing tracked them.
      - name: Lint
        run: npx eslint src --max-warnings=0

      - name: Build
        run: npm run build
        env:
          CI: 'false'

  # NOTE: a mobile typecheck job (tsc --noEmit) is intentionally absent:
  # mobile/src/services/nfcService.ts imports Node's `crypto`, which fails
  # type resolution under @react-native/typescript-config (AUDIT A-8).
  # Add the job when ROADMAP task 4.3 fixes the crypto bundling.
